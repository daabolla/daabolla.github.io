<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Daabolla — Weather</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<style>
  :root{
    --blue-900: #0b1220;
    --blue-700:#1e3a8a;
    --accent: #2563eb;
    --accent-2: #60a5fa;
    --bg-card: #ffffff;
    --muted: #64748b;
    --glass: rgba(255,255,255,0.95);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; }

  body{
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    /* match index page background: cinematic blue radial */
    background: radial-gradient(circle at top, #3b82f6 0%, #1e3a8a 100%);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    color: var(--blue-900);
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px;
  }

  /* centered window (main card) */
  .stage {
    width: 100%;
    max-width: 1180px;            /* keep content centered and constrained */
    background: linear-gradient(180deg, rgba(255,255,255,0.98), #eaf6ff);
    border-radius: 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.28);
    padding: 28px;
    overflow: hidden;            /* prevent children from overflowing */
  }

  /* header (title + search) */
  .header {
    display:flex;
    gap:16px;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .brand {
    display:flex;
    gap:14px;
    align-items:center;
  }
  .logo {
    width:56px;height:56px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:white; font-weight:700; display:flex;align-items:center;justify-content:center;
    box-shadow: 0 8px 28px rgba(37,99,235,0.2);
    font-size:20px;
  }
  .title {
    font-size:20px;
    font-weight:700;
    color:var(--blue-900);
  }
  .subtitle {
    font-size:13px;color:var(--muted); margin-top:4px;
  }

  .controls {
    display:flex;
    gap:10px;
    align-items:center;
  }
  .controls input[type="search"]{
    padding:10px 12px;
    border-radius:10px;
    border:1px solid rgba(14,20,40,0.06);
    width:320px;
    background:white;
    outline:none;
    font-size:14px;
  }
  .controls button {
    padding:10px 14px;
    border-radius:10px;
    border: none;
    cursor:pointer;
    font-weight:700;
    background: linear-gradient(90deg,var(--accent),var(--accent-2));
    color:white;
  }
  .controls .secondary {
    background:transparent;
    border:1px solid rgba(37,99,235,0.12);
    color:var(--accent);
    font-weight:700;
    padding:8px 12px;
  }

  /* main content area inside the card */
  .content {
    display:grid;
    grid-template-columns: 1fr;
    gap:18px;
  }

  .panel {
    background: var(--bg-card);
    border-radius:14px;
    padding:18px;
    border:1px solid #f1f6ff;
    box-shadow: 0 8px 26px rgba(12,15,30,0.04);
  }

  /* current weather row */
  .current-row {
    display:flex;
    gap:18px;
    align-items:center;
    justify-content:space-between;
  }
  .current-left {
    display:flex;
    gap:18px;
    align-items:center;
  }
  .icon-box {
    width:120px;height:120px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, rgba(37,99,235,0.08), rgba(96,165,250,0.03));
    font-size:54px;
  }
  .reading {
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width: 220px;
  }
  .place {
    font-size:14px;color:var(--muted);
  }
  .temp {
    font-size:56px;font-weight:700;color:var(--blue-900);
  }
  .cond {
    font-size:15px;color:var(--muted);
  }
  .meta {
    font-size:13px;color:var(--muted);
  }

  .right-meta {
    text-align:right;
    min-width:200px;
    font-size:13px;color:var(--muted);
  }
  .right-meta .small { margin-bottom:8px; display:block; }

  hr.sep {
    margin:18px 0;border:none;border-top:1px solid #f1f6ff;
  }

  /* forecast strip */
  .forecast-strip {
    display:flex;
    gap:12px;
    margin-top:8px;
  }
  .forecast-day {
    flex:1;
    background: linear-gradient(180deg,#fff,#fbfdff);
    border-radius:12px;
    padding:12px;
    text-align:center;
    border:1px solid #f0f6ff;
  }
  .forecast-day .dayname { font-size:13px; font-weight:700; color:var(--muted); }
  .forecast-day .emoji { font-size:26px; margin:8px 0; }
  .forecast-day .temps { font-weight:700; font-size:18px; color:var(--blue-900); }
  .forecast-day .desc { font-size:13px; color:var(--muted); margin-top:6px; }

  /* hourly strip */
  .hourly-strip {
    display:flex;
    gap:10px;
    overflow:auto;
    padding-bottom:6px;
    margin-top:8px;
  }
  .hour-item {
    min-width:84px;
    padding:10px;
    background:linear-gradient(180deg,#fff,#fbfdff);
    border-radius:10px;
    text-align:center;
    border:1px solid #f0f6ff;
  }
  .hour-item .time { font-size:12px; color:var(--muted); }
  .hour-item .emoji { font-size:20px; margin:6px 0; }
  .hour-item .t { font-weight:700; font-size:16px; color:var(--blue-900); }

  .footer {
    text-align:center;
    margin-top:14px;
    color:var(--muted);
    font-size:13px;
  }

  /* responsive */
  @media (max-width: 900px) {
    .header { flex-direction:column; align-items:stretch; gap:12px; }
    .controls { justify-content:flex-start; flex-wrap:wrap; }
    .controls input[type="search"]{ width:100%; }
    .current-row { flex-direction:column; align-items:flex-start; gap:12px; }
    .right-meta { text-align:left; width:100%; }
  }

</style>
</head>
<body>
  <div class="stage" role="main" aria-labelledby="title">
    <div class="header">
      <div class="brand">
        <div class="logo">D</div>
        <div>
          <div class="title" id="title">Daabolla — Weather</div>
          <div class="subtitle">Search city or use your location to see the weather</div>
        </div>
      </div>

      <div class="controls" role="search">
        <input id="search" type="search" placeholder="Search city (e.g. Warsaw, London)" aria-label="Search city">
        <button id="searchBtn">Search</button>
        <button id="locBtn" class="secondary">Use my location</button>
      </div>
    </div>

    <div class="content">
      <!-- main weather panel -->
      <section class="panel" aria-live="polite" id="mainPanel">
        <div class="current-row">
          <div class="current-left">
            <div class="icon-box" id="weatherIcon" aria-hidden="true">☀️</div>
            <div class="reading">
              <div class="place" id="place">—</div>
              <div class="temp" id="temp">—°C</div>
              <div class="cond" id="condition">—</div>
              <div class="meta" id="meta">Wind: — • Dir: —</div>
            </div>
          </div>

          <div class="right-meta">
            <span class="small">Last updated</span>
            <div id="lastUpdated">—</div>
            <div style="margin-top:10px">
              <button id="refreshBtn" class="secondary">Refresh</button>
            </div>
          </div>
        </div>

        <hr class="sep" />

        <div>
          <div style="font-size:14px;color:var(--muted); margin-bottom:8px">3-day forecast</div>
          <div class="forecast-strip" id="forecast"></div>
        </div>

        <div style="height:14px"></div>

        <div>
          <div style="font-size:14px;color:var(--muted); margin-bottom:8px">Hourly (next 12 hours)</div>
          <div class="hourly-strip" id="hourly"></div>
        </div>
      </section>
    </div>

    <div class="footer">Powered by Open-Meteo • Free & no API key required</div>
  </div>

<script>
/* Open-Meteo weather code same as previous app, adapted to new DOM structure */

const els = {
  search: document.getElementById('search'),
  searchBtn: document.getElementById('searchBtn'),
  locBtn: document.getElementById('locBtn'),
  place: document.getElementById('place'),
  temp: document.getElementById('temp'),
  condition: document.getElementById('condition'),
  meta: document.getElementById('meta'),
  lastUpdated: document.getElementById('lastUpdated'),
  refreshBtn: document.getElementById('refreshBtn'),
  forecast: document.getElementById('forecast'),
  hourly: document.getElementById('hourly'),
  weatherIcon: document.getElementById('weatherIcon'),
  info: null
};

let currentLocation = null;
let lastFetched = null;
let autoTimer = null;
const AUTO_REFRESH_MS = 10 * 60 * 1000;

function weatherCodeToText(code){
  const map = {
    0: 'Clear sky', 1:'Mainly clear', 2:'Partly cloudy', 3:'Overcast',
    45:'Fog', 48:'Depositing rime fog',
    51:'Light drizzle', 53:'Moderate drizzle', 55:'Dense drizzle',
    56:'Freezing drizzle', 57:'Dense freezing drizzle',
    61:'Slight rain', 63:'Moderate rain', 65:'Heavy rain',
    66:'Freezing rain', 67:'Heavy freezing rain',
    71:'Slight snow', 73:'Moderate snow', 75:'Heavy snow',
    77:'Snow grains', 80:'Slight rain showers', 81:'Moderate rain showers',
    82:'Violent rain showers', 85:'Slight snow showers', 86:'Heavy snow showers',
    95:'Thunderstorm', 96:'Thunderstorm with slight hail', 99:'Thunderstorm with heavy hail'
  };
  return map[code] || 'Unknown';
}
function weatherCodeToEmoji(code){
  if (code === 0 || code === 1) return '☀️';
  if (code === 2 || code === 3) return '⛅';
  if ([45,48].includes(code)) return '🌫️';
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
  if ([71,73,75,77,85,86].includes(code)) return '❄️';
  if ([95,96,99].includes(code)) return '⛈️';
  return '🌤️';
}

async function geocodeCity(name){
  try{
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=6&language=en&format=json`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('Geocode failed');
    const data = await r.json();
    return data.results || [];
  }catch(e){
    console.error(e);
    return [];
  }
}

async function fetchWeather(lat, lon){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto&forecast_days=4`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('Forecast failed');
    const data = await r.json();
    lastFetched = Date.now();
    updateLastUpdated(lastFetched);
    return data;
  }catch(e){
    console.error(e);
    return null;
  }
}

function updateLastUpdated(ts){ els.lastUpdated.textContent = ts ? new Date(ts).toLocaleString() : '—'; }

function renderCurrent(data, placeName){
  if (!data || !data.current_weather) {
    els.place.textContent = 'No data';
    els.temp.textContent = '—°C';
    els.condition.textContent = '—';
    els.meta.textContent = '';
    els.weatherIcon.textContent = '—';
    return;
  }
  const cw = data.current_weather;
  els.place.textContent = placeName;
  els.temp.textContent = `${Math.round(cw.temperature)}°C`;
  els.condition.textContent = weatherCodeToText(cw.weathercode);
  els.meta.textContent = `Wind: ${cw.windspeed} m/s • Dir: ${Math.round(cw.winddirection)}° • Time: ${new Date(cw.time).toLocaleTimeString()}`;
  els.weatherIcon.innerHTML = `<div style="font-size:56px">${weatherCodeToEmoji(cw.weathercode)}</div>`;
}

function renderForecast(data){
  if (!data || !data.daily) { els.forecast.innerHTML = ''; return; }
  const daily = data.daily;
  const n = Math.min(daily.time.length, 4);
  els.forecast.innerHTML = '';
  for (let i = 0; i < n; i++){
    const dayName = new Date(daily.time[i]).toLocaleDateString(undefined, { weekday: 'short', month:'short', day:'numeric' });
    const hi = Math.round(daily.temperature_2m_max[i]);
    const lo = Math.round(daily.temperature_2m_min[i]);
    const wc = daily.weathercode[i];
    const item = document.createElement('div');
    item.className = 'forecast-day';
    item.innerHTML = `<div class="dayname">${dayName}</div>
                      <div class="emoji">${weatherCodeToEmoji(wc)}</div>
                      <div class="temps">${hi}° / ${lo}°</div>
                      <div class="desc">${weatherCodeToText(wc)}</div>`;
    els.forecast.appendChild(item);
  }
}

function renderHourly(data){
  if (!data || !data.hourly) { els.hourly.innerHTML = ''; return; }
  const hourly = data.hourly;
  const now = new Date();
  const items = [];
  for (let i=0;i<hourly.time.length;i++){
    const t = new Date(hourly.time[i]);
    if (t < now) continue;
    items.push({ t, temp: Math.round(hourly.temperature_2m[i]), wc: hourly.weathercode[i] });
    if (items.length >= 12) break;
  }
  els.hourly.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'hour-item';
    div.innerHTML = `<div class="time">${it.t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
                     <div class="emoji">${weatherCodeToEmoji(it.wc)}</div>
                     <div class="t">${it.temp}°</div>`;
    els.hourly.appendChild(div);
  });
}

async function chooseLocation(loc){
  currentLocation = loc;
  const data = await fetchWeather(loc.lat, loc.lon);
  if (!data) return;
  renderCurrent(data, loc.name);
  renderForecast(data);
  renderHourly(data);
  // auto refresh interval
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(async () => {
    const d = await fetchWeather(loc.lat, loc.lon);
    if (d){ renderCurrent(d, loc.name); renderForecast(d); renderHourly(d); }
  }, AUTO_REFRESH_MS);
}

// search flow: pick first geocode result automatically
async function searchAndShow(name){
  if (!name) return;
  const res = await geocodeCity(name);
  if (!res.length) {
    alert('No results found');
    return;
  }
  const first = res[0];
  const pretty = `${first.name}${first.admin1 ? ', ' + first.admin1 : ''}${first.country ? ' — ' + first.country : ''}`;
  await chooseLocation({ name: pretty, lat: first.latitude, lon: first.longitude });
}

els.searchBtn.addEventListener('click', ()=> {
  const q = els.search.value.trim();
  if (q) searchAndShow(q);
});
els.search.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); els.searchBtn.click(); } });

els.locBtn.addEventListener('click', () => {
  if (!navigator.geolocation) { alert('Geolocation not supported'); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    const name = `Lat ${lat.toFixed(2)}, Lon ${lon.toFixed(2)}`;
    await chooseLocation({ name, lat, lon });
  }, err => { alert('Unable to get location'); console.error(err); });
});

els.refreshBtn.addEventListener('click', async () => {
  if (!currentLocation) return;
  const d = await fetchWeather(currentLocation.lat, currentLocation.lon);
  if (d){ renderCurrent(d, currentLocation.name); renderForecast(d); renderHourly(d); }
});

// default on load
window.addEventListener('load', ()=> {
  const defaultCity = 'Warsaw';
  els.search.value = defaultCity;
  searchAndShow(defaultCity);
});
</script>
</body>
</html>
