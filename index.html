<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Returns Dashboard</title>
  <!-- Lightweight CSV Parser -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Header & Loading */
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    .loading { text-align: center; padding: 3rem; color: var(--muted); }
    .spinner { display: inline-block; width: 2rem; height: 2rem; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 0.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: var(--danger); background: #fee2e2; padding: 1rem; border-radius: 8px; margin-top: 1rem; display: none; }

    /* Dashboard Layout */
    .dashboard { display: none; }
    
    /* Summary Cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: var(--card); padding: 1.25rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { margin: 0 0 0.5rem; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .card.today .value { color: var(--success); }
    .card.warning .value { color: var(--warning); }
    .card.danger .value { color: var(--danger); }

    /* Filters */
    .filters { background: var(--card); padding: 1rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; }
    .filter-group { flex: 1 1 200px; display: flex; flex-direction: column; gap: 0.25rem; }
    .filter-group label { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
    input, select { padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; width: 100%; font-size: 0.9rem; background: #fff; transition: border 0.2s; }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .filter-actions { flex: 1 1 100%; display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem; }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; background: var(--primary); color: #fff; }
    .btn:hover { background: var(--primary-hover); }
    .btn.secondary { background: #f3f4f6; color: var(--text); }

    /* Analytics */
    .analytics { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .chart-box { background: var(--card); padding: 1rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .chart-box h4 { margin: 0 0 1rem; font-size: 0.95rem; color: var(--text); }
    .top-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
    .top-item { display: flex; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .top-item:last-child { border-bottom: none; }
    .top-rank { width: 2rem; font-weight: 600; color: var(--muted); }
    .top-bar-wrap { flex: 1; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin: 0 0.75rem; }
    .top-bar { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.5s ease; }
    .top-count { font-size: 0.85rem; font-weight: 500; min-width: 2rem; text-align: right; }

    /* Table */
    .table-wrapper { background: var(--card); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-x: auto; margin-bottom: 1rem; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { background: #f9fafb; position: sticky; top: 0; cursor: pointer; user-select: none; font-weight: 600; color: var(--muted); }
    th:hover { background: #f3f4f6; }
    th::after { content: ' ⇅'; opacity: 0.3; }
    th.sort-asc::after { content: ' ↑'; opacity: 1; }
    th.sort-desc::after { content: ' ↓'; opacity: 1; }
    tr:hover td { background: #f8fafc; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Pagination */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 0.75rem; padding: 0.5rem 0; }
    .pagination button { padding: 0.5rem 1rem; border: 1px solid var(--border); background: var(--card); border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    #page-info { font-size: 0.85rem; color: var(--muted); }

    @media (max-width: 640px) {
      body { padding: 0.75rem; }
      .filters { flex-direction: column; }
      .card .value { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📦 Laptop Returns Dashboard</h1>
    </header>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Loading data from Google Sheet...</div>
    </div>
    <div id="error" class="error"></div>

    <div id="dashboard" class="dashboard">
      <!-- Summary Cards -->
      <div class="cards">
        <div class="card today">
          <h3>Returns Today (PL)</h3>
          <div id="stat-today" class="value">-</div>
        </div>
        <div class="card warning">
          <h3>W naprawie</h3>
          <div id="stat-naprawie" class="value">-</div>
        </div>
        <div class="card danger">
          <h3>W serwisie zewnętrznym</h3>
          <div id="stat-zewnetrznym" class="value">-</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filters">
        <div class="filter-group"><label>Date From (Arrival)</label><input type="date" id="f-date-from"></div>
        <div class="filter-group"><label>Date To (Arrival)</label><input type="date" id="f-date-to"></div>
        <div class="filter-group"><label>Customer Name</label><input type="text" id="f-customer" placeholder="Partial match..."></div>
        <div class="filter-group"><label>Market Status (H)</label><select id="f-status"><option value="">All</option></select></div>
        <div class="filter-group"><label>Physical Status (K)</label><select id="f-physical"><option value="">All</option></select></div>
        <div class="filter-group"><label>Search Reason (I)</label><input type="text" id="f-reason" placeholder="e.g., screen, crack..."></div>
        <div class="filter-actions">
          <button class="btn secondary" onclick="resetFilters()">Reset</button>
        </div>
      </div>

      <!-- Analytics -->
      <div class="analytics">
        <div class="chart-box">
          <h4>🔍 Top Return Reasons</h4>
          <ul id="top-reasons" class="top-list"></ul>
        </div>
        <div class="chart-box">
          <h4>🌐 Top Marketplaces</h4>
          <ul id="top-marketplaces" class="top-list"></ul>
        </div>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table id="data-table">
          <thead>
            <tr id="table-head"></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination">
        <button id="btn-prev" disabled>Previous</button>
        <span id="page-info">Page 1</span>
        <button id="btn-next" disabled>Next</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // === CONFIG & STATE ===
      const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1bFiGJjn1bE1f7Ipmg1kY7r-e95_U0Ovk9ndZMOZGyRk/export?format=csv&gid=0';
      const PAGE_SIZE = 50;
      
      let rawData = [];
      let filteredData = [];
      let currentPage = 1;
      let sortConfig = { key: null, asc: true };

      // Column Mapping (Index -> Key)
      const COL_MAP = [
        'dateA', 'orderSys', 'marketplace', 'purchaseDate', 'orderMkt',
        'customer', 'claimDate', 'statusMkt', 'reason', 'price',
        'physicalStatus', 'link', 'recordDate'
      ];

      const HEADERS = [
        'Arrival Date', 'Order #', 'Marketplace', 'Purchase Date', 'Mkt Order #',
        'Customer', 'Claim Date', 'Status (Mkt)', 'Return Reason', 'Total Price',
        'Physical Status', 'Mkt Link', 'Added Date'
      ];

      // === UTILS ===
      const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
      
      // Get today in Europe/Warsaw as YYYY-MM-DD
      const getWarsawToday = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Warsaw' });

      // Robust date parser for CSV
      const parseDate = (str) => {
        if (!str) return null;
        if (/^\d{4}-\d{2}-\d{2}/.test(str)) return new Date(str);
        const parts = str.split(/[\/\.-]/);
        if (parts.length === 3) return new Date(parts[2], parts[1]-1, parts[0]); // DD/MM/YYYY or similar
        const d = new Date(str);
        return isNaN(d.getTime()) ? null : d;
      };

      const normalizeText = (text) => (text || '').replace(/[^\p{L}\p{N}\s]/gu, '').trim().toLowerCase().replace(/\s+/g, ' ');

      // === DOM REFS ===
      const $ = id => document.getElementById(id);
      const els = {
        loading: $('loading'), error: $('error'), dashboard: $('dashboard'),
        fDateFrom: $('f-date-from'), fDateTo: $('f-date-to'), fCustomer: $('f-customer'),
        fStatus: $('f-status'), fPhysical: $('f-physical'), fReason: $('f-reason'),
        statToday: $('stat-today'), statNaprawie: $('stat-naprawie'), statZew: $('stat-zewnetrznym'),
        topReasons: $('top-reasons'), topMarketplaces: $('top-marketplaces'),
        tableHead: $('table-head'), tableBody: $('table-body'),
        btnPrev: $('btn-prev'), btnNext: $('btn-next'), pageInfo: $('page-info')
      };

      // === CORE LOGIC ===
      function init() {
        Papa.parse(SHEET_CSV_URL, {
          download: true,
          skipEmptyLines: true,
          complete: (res) => {
            if (res.errors.length > 0 && res.data.length < 2) {
              showError('Failed to load sheet. Check if it is public.');
              return;
            }
            // Skip header row, map to objects
            rawData = res.data.slice(1).map(row => {
              let obj = {};
              COL_MAP.forEach((key, i) => obj[key] = row[i] || '');
              obj._dateAObj = parseDate(obj.dateA);
              obj._dateAStr = obj._dateAObj ? obj._dateAObj.toISOString().split('T')[0] : '';
              return obj;
            }).filter(r => r.dateA); // Remove empty rows

            populateDropdowns();
            setupEventListeners();
            applyFilters();
            els.loading.style.display = 'none';
            els.dashboard.style.display = 'block';
          },
          error: () => showError('Network error fetching sheet.')
        });
      }

      function populateDropdowns() {
        const getStatuses = [...new Set(rawData.map(r => r.statusMkt))].filter(Boolean).sort();
        const getPhysical = [...new Set(rawData.map(r => r.physicalStatus))].filter(Boolean).sort();
        
        const addOptions = (sel, items) => {
          sel.innerHTML = '<option value="">All</option>';
          items.forEach(v => sel.add(new Option(v, v)));
        };
        addOptions(els.fStatus, getStatuses);
        addOptions(els.fPhysical, getPhysical);
      }

      function setupEventListeners() {
        // Debounced inputs
        [els.fDateFrom, els.fDateTo, els.fCustomer, els.fReason].forEach(el => {
          el.addEventListener('input', debounce(applyFilters, 300));
        });
        [els.fStatus, els.fPhysical].forEach(el => el.addEventListener('change', applyFilters));

        // Sort headers
        els.tableHead.addEventListener('click', (e) => {
          const th = e.target.closest('th');
          if (!th) return;
          const key = th.dataset.key;
          if (sortConfig.key === key) sortConfig.asc = !sortConfig.asc;
          else { sortConfig.key = key; sortConfig.asc = true; }
          
          // Update UI classes
          els.tableHead.querySelectorAll('th').forEach(t => t.classList.remove('sort-asc', 'sort-desc'));
          th.classList.add(sortConfig.asc ? 'sort-asc' : 'sort-desc');
          applyFilters(); // Re-sort & render
        });

        // Pagination
        els.btnPrev.addEventListener('click', () => { currentPage--; renderTable(); });
        els.btnNext.addEventListener('click', () => { currentPage++; renderTable(); });
      }

      function applyFilters() {
        const todayStr = getWarsawToday();
        const dFrom = els.fDateFrom.value;
        const dTo = els.fDateTo.value;
        const cust = normalizeText(els.fCustomer.value);
        const status = els.fStatus.value;
        const phys = els.fPhysical.value;
        const reason = normalizeText(els.fReason.value);

        filteredData = rawData.filter(r => {
          if (dFrom && r._dateAStr < dFrom) return false;
          if (dTo && r._dateAStr > dTo) return false;
          if (cust && !normalizeText(r.customer).includes(cust)) return false;
          if (status && r.statusMkt !== status) return false;
          if (phys && r.physicalStatus !== phys) return false;
          if (reason && !normalizeText(r.reason).includes(reason)) return false;
          return true;
        });

        // Sort
        if (sortConfig.key) {
          filteredData.sort((a, b) => {
            let va = a[sortConfig.key], vb = b[sortConfig.key];
            if (sortConfig.key === 'dateA' || sortConfig.key === 'purchaseDate' || sortConfig.key === 'claimDate') {
              va = parseDate(va)?.getTime() || 0; vb = parseDate(vb)?.getTime() || 0;
            }
            if (typeof va === 'number') return sortConfig.asc ? va - vb : vb - va;
            return sortConfig.asc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
          });
        }

        currentPage = 1;
        updateStats(todayStr);
        renderTable();
        updateAnalytics();
      }

      function updateStats(todayStr) {
        els.statToday.textContent = filteredData.filter(r => r._dateAStr === todayStr).length;
        els.statNaprawie.textContent = filteredData.filter(r => r.statusMkt === 'W naprawie').length;
        els.statZew.textContent = filteredData.filter(r => r.statusMkt === 'W serwisie zewnętrznym').length;
      }

      function renderTable() {
        const start = (currentPage - 1) * PAGE_SIZE;
        const end = start + PAGE_SIZE;
        const pageData = filteredData.slice(start, end);
        
        // Build Headers once
        if (els.tableHead.children.length === 0) {
          els.tableHead.innerHTML = HEADERS.map((h, i) => `<th data-key="${COL_MAP[i]}">${h}</th>`).join('');
        }

        // Build Rows
        els.tableBody.innerHTML = pageData.map(r => {
          const fmtPrice = r.price ? `€${parseFloat(r.price).toFixed(2)}` : '-';
          const link = r.link ? `<a href="${r.link}" target="_blank" rel="noopener">Open</a>` : '-';
          return `<tr>
            <td>${r.dateA}</td><td>${r.orderSys}</td><td>${r.marketplace}</td>
            <td>${r.purchaseDate}</td><td>${r.orderMkt}</td><td>${r.customer}</td>
            <td>${r.claimDate}</td><td>${r.statusMkt}</td><td title="${r.reason}">${r.reason.slice(0, 30)}${r.reason.length>30?'...':''}</td>
            <td>${fmtPrice}</td><td>${r.physicalStatus}</td><td>${link}</td><td>${r.recordDate}</td>
          </tr>`;
        }).join('');

        // Pagination UI
        const totalPages = Math.ceil(filteredData.length / PAGE_SIZE) || 1;
        els.pageInfo.textContent = `Page ${currentPage} of ${totalPages} (${filteredData.length} records)`;
        els.btnPrev.disabled = currentPage <= 1;
        els.btnNext.disabled = currentPage >= totalPages;
      }

      function updateAnalytics() {
        // Top Reasons
        const reasonCounts = {};
        filteredData.forEach(r => {
          const norm = normalizeText(r.reason) || 'unknown';
          reasonCounts[norm] = (reasonCounts[norm] || 0) + 1;
        });
        renderTopList(els.topReasons, Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1]).slice(0, 8), true);

        // Top Marketplaces
        const mktCounts = {};
        filteredData.forEach(r => {
          if (r.marketplace) mktCounts[r.marketplace] = (mktCounts[r.marketplace] || 0) + 1;
        });
        renderTopList(els.topMarketplaces, Object.entries(mktCounts).sort((a,b)=>b[1]-a[1]).slice(0, 8), false);
      }

      function renderTopList(container, data, showOriginalReason) {
        if (!data.length) { container.innerHTML = '<li class="top-item" style="color:#6b7280">No data</li>'; return; }
        const max = data[0][1];
        container.innerHTML = data.map((d, i) => {
          const pct = (d[1] / max * 100).toFixed(1);
          // For reasons, we show the original text from rawData to keep it readable
          const displayText = showOriginalReason ? rawData.find(r => normalizeText(r.reason) === d[0])?.reason || d[0] : d[0];
          return `<li class="top-item">
            <div class="top-rank">${i+1}</div>
            <div class="top-bar-wrap"><div class="top-bar" style="width:${pct}%"></div></div>
            <div style="flex:2; min-width:0; margin-right:0.5rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:0.85rem" title="${displayText}">${displayText}</div>
            <div class="top-count">${d[1]}</div>
          </li>`;
        }).join('');
      }

      function resetFilters() {
        els.fDateFrom.value = ''; els.fDateTo.value = '';
        els.fCustomer.value = ''; els.fReason.value = '';
        els.fStatus.value = ''; els.fPhysical.value = '';
        applyFilters();
      }

      function showError(msg) {
        els.error.textContent = msg;
        els.error.style.display = 'block';
        els.loading.style.display = 'none';
      }

      // Expose reset globally for inline onclick
      window.resetFilters = resetFilters;
      
      // Start
      init();
    })();
  </script>
</body>
</html>
