<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .calculator {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 18px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .percentage-input {
            padding-right: 50px;
        }

        .percentage-sign {
            position: absolute;
            right: 16px;
            font-size: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .calculate-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .calculate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .calculate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-section {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 20px;
        }

        .result-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .result-formula {
            font-size: 14px;
            color: #666;
            font-style: italic;
        }

        .clear-btn {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e1e5e9;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .clear-btn:hover {
            background: #e9ecef;
            border-color: #d1d5db;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            input {
                font-size: 16px;
                padding: 14px 18px 14px 45px;
            }
            
            .input-icon {
                left: 14px;
                font-size: 18px;
            }
            
            .percentage-sign {
                right: 14px;
                font-size: 18px;
            }
            
            .result-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Percentage Calculator</h1>
            <p class="subtitle">Calculate the percentage value of any number</p>
        </header>

        <main>
            <div class="calculator">
                <div class="input-group">
                    <label for="value">Enter Value</label>
                    <div class="input-wrapper">
                        <span class="input-icon">$</span>
                        <input 
                            type="number" 
                            id="value" 
                            placeholder="0.00"
                            step="0.01"
                            min="0"
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="percentage">Enter Percentage</label>
                    <div class="input-wrapper">
                        <span class="input-icon">%</span>
                        <input 
                            type="number" 
                            id="percentage" 
                            placeholder="0"
                            step="0.01"
                            min="0"
                            max="100"
                            class="percentage-input"
                        >
                        <span class="percentage-sign">%</span>
                    </div>
                </div>

                <div class="button-group">
                    <button id="calculateBtn" class="calculate-btn">
                        Calculate
                    </button>
                    <button id="clearBtn" class="clear-btn">
                        Clear
                    </button>
                </div>
            </div>

            <section class="result-section">
                <div class="result-label">Result</div>
                <div class="result-value" id="resultValue">-</div>
                <div class="result-formula" id="resultFormula"></div>
            </section>
        </main>
    </div>

    <script>
        class PercentageCalculator {
            constructor() {
                this.valueInput = document.getElementById('value');
                this.percentageInput = document.getElementById('percentage');
                this.calculateBtn = document.getElementById('calculateBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.resultValue = document.getElementById('resultValue');
                this.resultFormula = document.getElementById('resultFormula');
                
                this.initializeEventListeners();
                this.updateButtonState();
            }
            
            initializeEventListeners() {
                this.calculateBtn.addEventListener('click', () => this.calculate());
                this.clearBtn.addEventListener('click', () => this.clear());
                
                this.valueInput.addEventListener('input', () => this.updateButtonState());
                this.percentageInput.addEventListener('input', () => this.updateButtonState());
                
                // Allow calculation on Enter key
                this.valueInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.calculate();
                });
                
                this.percentageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.calculate();
                });
            }
            
            updateButtonState() {
                const hasValue = this.valueInput.value.trim() !== '';
                const hasPercentage = this.percentageInput.value.trim() !== '';
                this.calculateBtn.disabled = !(hasValue && hasPercentage);
            }
            
            calculate() {
                const value = parseFloat(this.valueInput.value);
                const percentage = parseFloat(this.percentageInput.value);
                
                if (isNaN(value) || isNaN(percentage)) {
                    this.showError('Please enter valid numbers');
                    return;
                }
                
                if (value < 0) {
                    this.showError('Value cannot be negative');
                    return;
                }
                
                if (percentage < 0 || percentage > 100) {
                    this.showError('Percentage must be between 0 and 100');
                    return;
                }
                
                const result = (value * percentage) / 100;
                
                this.displayResult(value, percentage, result);
            }
            
            displayResult(value, percentage, result) {
                this.resultValue.textContent = this.formatCurrency(result);
                this.resultFormula.textContent = `${this.formatCurrency(value)} × ${percentage}% = ${this.formatCurrency(result)}`;
                
                // Add animation
                this.resultValue.style.animation = 'none';
                setTimeout(() => {
                    this.resultValue.style.animation = 'fadeIn 0.5s ease';
                }, 10);
            }
            
            formatCurrency(amount) {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(amount);
            }
            
            showError(message) {
                this.resultValue.textContent = 'Error';
                this.resultFormula.textContent = message;
                this.resultValue.style.color = '#dc3545';
                
                setTimeout(() => {
                    this.resultValue.style.color = '#333';
                }, 3000);
            }
            
            clear() {
                this.valueInput.value = '';
                this.percentageInput.value = '';
                this.resultValue.textContent = '-';
                this.resultFormula.textContent = '';
                this.updateButtonState();
                this.valueInput.focus();
            }
        }

        // Add fade-in animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize the calculator when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new PercentageCalculator();
        });
    </script>
</body>
</html>
